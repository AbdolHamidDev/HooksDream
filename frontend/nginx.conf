server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # File có tên hash trong tên nên được cache lâu.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker và manifest: không được cache lâu để cập nhật kịp.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Client-side routing (react-router): mọi đường dẫn đều trả về index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API và WebSocket không đi qua nginx (gọi thẳng backend).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
